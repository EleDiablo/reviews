{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 420px;">
    <div class="card card-modern p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-dark bg-opacity-10 text-dark rounded-circle mb-3" style="width: 56px; height: 56px;">
                <i class="bi bi-lock fs-3"></i>
            </div>
            <h1 class="h4 fw-bold mb-1">Закрытый раздел</h1>
            <p class="text-muted small mb-0">Авторизуйтесь для просмотра отзывов</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger rounded-3 small py-2">
                Неверное имя пользователя или пароль.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label fw-semibold small">Логин</label>
                <input type="text" name="username" autofocus required id="id_username" class="form-control" placeholder="Введите логин">
            </div>
            <div class="mb-4">
                <label for="id_password" class="form-label fw-semibold small">Пароль</label>
                <input type="password" name="password" required id="id_password" class="form-control" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-modern w-100">Войти</button>
        </form>
    </div>
</div>
{% endblock %}
